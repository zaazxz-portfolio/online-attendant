server {
    listen 80;
    server_name localhost;

    # Root langsung ke folder apps/ — jadi /auth/login.php otomatis
    # resolve ke /var/www/html/apps/auth/login.php
    root /var/www/html/apps;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    # ── Static assets: alias ke path asli di luar apps/ ───
    location /public/ {
        alias /var/www/html/public/;
        try_files $uri =404;
    }

    location /vendor/ {
        alias /var/www/html/vendor/;
        try_files $uri =404;
    }

    location = /manifest.json {
        root /var/www/html;
    }

    location = /service-worker.js {
        root /var/www/html;
    }

    # ── PHP-FPM handler ───────────────────────────────────
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "date.timezone=Asia/Jakarta";
    }

    # ── Fallback: semua request non-file ke index.php ─────
    location / {
        try_files $uri $uri/ @extensionless_php;
    }

    location @extensionless_php {
        if (-f $document_root$uri.php) {
            rewrite ^(.*)$ $1.php last;
        }
        rewrite ^ /index.php?$query_string last;
    }

    # ── Deny hidden files ─────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
